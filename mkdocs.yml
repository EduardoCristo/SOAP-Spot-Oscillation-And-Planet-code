site_name: Spot Oscillation and Planet
site_author: "Eduardo Cristo"
docs_dir: docs
repo_url: https://github.com/EduardoCristo/SOAP-Spot-Oscillation-And-Planet-code

theme:
  name: material
  logo: assets/SOAP_K.png
  favicon: assets/SOAP_K.png   # also update the browser tab icon
  font:
    text: Inter
    code: Fira Code
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/telescope
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs          # top-level tabs instead of sidebar
    - navigation.tabs.sticky   # tabs stay visible on scroll
    - navigation.sections      # group nav into sections
    - navigation.expand        # expand all nav by default
    - navigation.top           # back-to-top button
    - toc.integrate            # merge ToC into left sidebar
    - toc.follow               # ToC auto-scrolls with page
    - content.code.copy        # copy button on code blocks
    - header.autohide          # hide header on scroll down
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
nav:
  - Home: index.md

  - Install: install.md

  - Examples:
      - Stellar Activity Time-Series: notebooks/RV_phot_activity.ipynb
      - Transit & Absorption Time-Series: notebooks/Transit_time_series.ipynb
      - Transit Local Profiles: notebooks/Doppler_shadow.ipynb
      - Spot-Crossing Transit & Absorption Time-Series: notebooks/Transit_time_spot_crossing.ipynb
      - Transit time-series (RV + phot): notebooks/RV_phot_transit.ipynb
      - Transit time-series AR crossing (RV + phot): notebooks/RV_phot_AR_crossing.ipynb


  - API Reference:
    - api/simulation.md
    - api/star.md
    - api/planet.md
    - api/ring.md
    - api/active_region.md
    - api/pixel_CCF.md
    - api/pixel_spectrum.md

  - Contacts: contacts.md
  - Acknowledgements: Acknowledgements.md

plugins:
  - search
  - mkdocs-jupyter
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            filters:
              - "!^_"
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EduardoCristo/SOAP-Spot-Oscillation-And-Planet-code
  footer:
    copyright: "©2026 Eduardo Cristo"